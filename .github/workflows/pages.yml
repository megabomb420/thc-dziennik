name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (tylko pliki aplikacji)
        run: |
          mkdir -p _site/icons _site/fonts
          cp index.html style.css app.js fx.js icons.js i18n.js sw.js manifest.webmanifest _site/
          cp icons/*.png _site/icons/
          cp fonts/*.woff2 _site/fonts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
